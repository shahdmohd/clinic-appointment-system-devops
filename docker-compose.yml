# version: '3.9'
services:
  web:
    build: .
    container_name: clinic_web
    command: /entrypoint.sh
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    depends_on:
      - db



  db:
    image: postgres:16
    container_name: clinic_db
    restart: unless-stopped
    env_file:
      - ./app/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data




volumes:
  postgres_data: