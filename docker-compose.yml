# version: '3.9'
services:
  web:
    build: .
    container_name: clinic_web
    command: /entrypoint.sh
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    env_file:
      - ./app/.env
    depends_on:
      - db
    networks:
      - frontend


  db:
    image: postgres:16
    container_name: clinic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - frontend
      # - backend


networks:
  frontend:
    driver: bridge

  # backend:
  #   driver: bridge
  #   internal: true

volumes:
  postgres_data: